# .github/workflows/trading-monitor.yml
# 433-v3 完整監控工作流 - 無需 GCP VM Python 環境

name: 433-v3 Trading Monitor

on:
  # 每天 UTC 14:00 執行 (台北時間 22:00)
  schedule:
    - cron: '0 14 * * *'
  
  # 允許手動觸發
  workflow_dispatch:
    inputs:
      test_mode:
        description: '測試模式'
        type: boolean
        default: false

env:
  TZ: 'Asia/Taipei'

jobs:
  # ========== Job 1: 數據獲取 ==========
  fetch-data:
    runs-on: ubuntu-latest
    outputs:
      has-data: ${{ steps.fetch.outputs.success }}
    
    steps:
      - name: Checkout 代碼
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 安裝依賴
        run: |
          pip install yfinance pandas numpy requests
      
      - name: 獲取市場數據
        id: fetch
        run: |
          python3 << 'PYTHON_SCRIPT'
          import yfinance as yf
          import json
          from datetime import datetime
          
          print("🔍 獲取市場數據...")
          
          TICKERS = {
              'core': '00662.TW',
              'leverage': '00670L.TW',
              'cash': '00865B.TW'
          }
          
          market_data = {
              'timestamp': datetime.now().isoformat(),
              'prices': {}
          }
          
          success = True
          for key, ticker in TICKERS.items():
              try:
                  stock = yf.Ticker(ticker)
                  info = stock.info
                  price = info.get('regularMarketPrice') or info.get('currentPrice')
                  
                  if price:
                      market_data['prices'][key] = {
                          'ticker': ticker,
                          'price': float(price),
                          'currency': 'TWD'
                      }
                      print(f"✓ {key}: NT$ {price:.2f}")
                  else:
                      print(f"✗ {key}: 無法獲取價格")
                      success = False
              except Exception as e:
                  print(f"✗ {key}: {str(e)}")
                  success = False
          
          # 獲取槓桿 ATH
          try:
              stock = yf.Ticker('00670L.TW')
              hist = stock.history(period='max')
              market_data['leverage_ath'] = float(hist['High'].max())
              print(f"✓ 槓桿 ATH: NT$ {market_data['leverage_ath']:.2f}")
          except Exception as e:
              print(f"✗ ATH: {str(e)}")
              market_data['leverage_ath'] = None
              success = False
          
          # 保存數據
          with open('market_data.json', 'w', encoding='utf-8') as f:
              json.dump(market_data, f, indent=2, ensure_ascii=False)
          
          print(f"\n{'✅' if success else '❌'} 數據獲取{'完成' if success else '失敗'}")
          
          # 設定輸出
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"success={'true' if success else 'false'}\n")
          PYTHON_SCRIPT
      
      - name: 上傳市場數據
        uses: actions/upload-artifact@v3
        with:
          name: market-data
          path: market_data.json
          retention-days: 30

  # ========== Job 2: 策略分析 ==========
  analyze-strategy:
    runs-on: ubuntu-latest
    needs: fetch-data
    if: needs.fetch-data.outputs.has-data == 'true'
    outputs:
      adjustment-required: ${{ steps.analyze.outputs.required }}
      has-risks: ${{ steps.analyze.outputs.has_risks }}
    
    steps:
      - name: Checkout 代碼
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 下載市場數據
        uses: actions/download-artifact@v3
        with:
          name: market-data
      
      - name: 策略分析
        id: analyze
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          from datetime import datetime
          
          print("📊 開始策略分析...")
          
          # 讀取市場數據
          with open('market_data.json', 'r') as f:
              market_data = json.load(f)
          
          # 配置參數
          INITIAL_WEIGHTS = {'core': 40, 'leverage': 30, 'cash': 30}
          DRAWDOWN_STEP = 5
          MAX_DRAWDOWN = -50
          MAX_LEVERAGE_WEIGHT = 50
          MAX_PLEDGE_RATIO = 20
          MIN_MAINTENANCE_RATE = 220
          
          # 計算回撤
          leverage_price = market_data['prices']['leverage']['price']
          leverage_ath = market_data['leverage_ath']
          drawdown = ((leverage_price - leverage_ath) / leverage_ath) * 100
          
          print(f"📉 當前回撤: {drawdown:.2f}%")
          
          # 檢查權重調整
          adjustment = {'required': False}
          
          if drawdown <= -5 and drawdown > MAX_DRAWDOWN:
              steps = int(abs(drawdown) // DRAWDOWN_STEP)
              
              new_weights = {
                  'core': INITIAL_WEIGHTS['core'] - steps,
                  'leverage': INITIAL_WEIGHTS['leverage'] + (steps * 2),
                  'cash': INITIAL_WEIGHTS['cash'] - steps
              }
              
              if new_weights['leverage'] <= MAX_LEVERAGE_WEIGHT:
                  beta = (new_weights['core'] * 1.0 + new_weights['leverage'] * 2.0) / 100
                  
                  adjustment = {
                      'required': True,
                      'drawdown': drawdown,
                      'steps': steps,
                      'old_weights': INITIAL_WEIGHTS,
                      'new_weights': new_weights,
                      'beta': beta,
                      'reason': f'槓桿回撤達 {drawdown:.1f}%，執行第 {steps} 階調整'
                  }
                  print(f"⚠️  需要調整權重！")
                  print(f"   新權重: Core {new_weights['core']}% / Leverage {new_weights['leverage']}% / Cash {new_weights['cash']}%")
              else:
                  adjustment = {
                      'required': False,
                      'reason': f'已達槓桿上限 {MAX_LEVERAGE_WEIGHT}%'
                  }
                  print(f"⛔ {adjustment['reason']}")
          else:
              adjustment = {
                  'required': False,
                  'reason': '未觸發調整條件'
              }
              print(f"✅ {adjustment['reason']}")
          
          # 風險檢查 (使用模擬數據，實際應從 Google Sheets 讀取)
          portfolio = {
              'total_value': 10000000,
              'pledge_amount': 1500000,
              'maintenance_rate': 250,
              'cash_value': 3000000
          }
          
          risks = []
          
          # 質押比例
          pledge_ratio = (portfolio['pledge_amount'] / portfolio['total_value']) * 100
          if pledge_ratio > MAX_PLEDGE_RATIO:
              risks.append({
                  'level': 'critical',
                  'type': 'PLEDGE_RATIO',
                  'message': f'質押比例 {pledge_ratio:.1f}% 超過 {MAX_PLEDGE_RATIO}% 紅線'
              })
          
          # 維持率
          if portfolio['maintenance_rate'] < MIN_MAINTENANCE_RATE:
              risks.append({
                  'level': 'critical',
                  'type': 'MAINTENANCE_RATE',
                  'message': f'維持率 {portfolio["maintenance_rate"]}% 低於 {MIN_MAINTENANCE_RATE}% 紅線'
              })
          
          # 現金覆蓋
          if portfolio['cash_value'] < portfolio['pledge_amount']:
              risks.append({
                  'level': 'warning',
                  'type': 'CASH_COVERAGE',
                  'message': '現金部位不足以覆蓋質押借款'
              })
          
          print(f"\n🔍 風險檢查: {'發現 ' + str(len(risks)) + ' 個警報' if risks else '無風險'}")
          
          # 組合結果
          analysis = {
              'timestamp': datetime.now().isoformat(),
              'market_data': market_data,
              'drawdown': drawdown,
              'adjustment': adjustment,
              'risks': risks,
              'portfolio': portfolio
          }
          
          # 保存結果
          with open('analysis.json', 'w', encoding='utf-8') as f:
              json.dump(analysis, f, indent=2, ensure_ascii=False)
          
          # 設定輸出
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"required={'true' if adjustment['required'] else 'false'}\n")
              f.write(f"has_risks={'true' if risks else 'false'}\n")
          
          print("\n✅ 分析完成")
          PYTHON_SCRIPT
      
      - name: 上傳分析結果
        uses: actions/upload-artifact@v3
        with:
          name: analysis-results
          path: analysis.json
          retention-days: 30

  # ========== Job 3: 生成報告 ==========
  generate-report:
    runs-on: ubuntu-latest
    needs: analyze-strategy
    
    steps:
      - name: Checkout 代碼
        uses: actions/checkout@v4
      
      - name: 下載分析結果
        uses: actions/download-artifact@v3
        with:
          name: analysis-results
      
      - name: 生成 Markdown 報告
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p reports/daily
          
          python3 << 'PYTHON_SCRIPT'
          import json
          from datetime import datetime
          
          with open('analysis.json', 'r') as f:
              data = json.load(f)
          
          report = f"""# 433-v3 監控報告
          
          **日期**: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}
          
          ## 📊 市場數據
          
          | 標的 | 價格 | 代碼 |
          |------|------|------|
          | Core | NT$ {data['market_data']['prices']['core']['price']:.2f} | 00662.TW |
          | Leverage | NT$ {data['market_data']['prices']['leverage']['price']:.2f} | 00670L.TW |
          | Cash | NT$ {data['market_data']['prices']['cash']['price']:.2f} | 00865B.TW |
          
          **槓桿歷史最高**: NT$ {data['market_data']['leverage_ath']:.2f}
          
          ## 📉 回撤分析
          
          **當前回撤**: {data['drawdown']:.2f}%
          
          ## ⚙️ 權重調整
          
          """
          
          if data['adjustment']['required']:
              adj = data['adjustment']
              report += f"""**狀態**: ⚠️ 需要調整
          
          **原因**: {adj['reason']}
          
          **新權重配置**:
          - Core: {adj['new_weights']['core']}%
          - Leverage: {adj['new_weights']['leverage']}%
          - Cash: {adj['new_weights']['cash']}%
          
          **組合 Beta**: {adj['beta']:.2f}
          """
          else:
              report += f"**狀態**: ✅ 無需調整\n\n**原因**: {data['adjustment']['reason']}\n"
          
          report += "\n## 🚨 風險檢查\n\n"
          
          if data['risks']:
              for risk in data['risks']:
                  emoji = '⛔' if risk['level'] == 'critical' else '⚠️'
                  report += f"- {emoji} **{risk['type']}**: {risk['message']}\n"
          else:
              report += "✅ 無風險警報\n"
          
          report += f"""
          ## 💼 投資組合概況
          
          - **總資產**: NT$ {data['portfolio']['total_value']:,.0f}
          - **質押金額**: NT$ {data['portfolio']['pledge_amount']:,.0f}
          - **維持率**: {data['portfolio']['maintenance_rate']}%
          - **現金部位**: NT$ {data['portfolio']['cash_value']:,.0f}
          
          ---
          *報告由 GitHub Actions 自動生成*
          """
          
          # 保存報告
          date_str = datetime.now().strftime('%Y-%m-%d')
          with open(f'reports/daily/report_{date_str}.md', 'w', encoding='utf-8') as f:
              f.write(report)
          
          print("✅ 報告生成完成")
          PYTHON_SCRIPT
      
      - name: 提交報告到 Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          git diff --staged --quiet || git commit -m "📊 Add daily report $(date +%Y-%m-%d)"
          git push || echo "No changes to push"

  # ========== Job 4: 發送通知 ==========
  notify:
    runs-on: ubuntu-latest
    needs: [analyze-strategy, generate-report]
    if: always()
    
    steps:
      - name: 下載分析結果
        uses: actions/download-artifact@v3
        with:
          name: analysis-results
        continue-on-error: true
      
      - name: 發送 Discord 通知
        if: ${{ secrets.DISCORD_WEBHOOK != '' }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          import requests
          from datetime import datetime
          
          webhook_url = os.environ.get('DISCORD_WEBHOOK')
          if not webhook_url:
              print("未設定 Discord Webhook")
              exit(0)
          
          try:
              with open('analysis.json', 'r') as f:
                  data = json.load(f)
              
              # 組合訊息
              message = "**433-v3 每日監控報告**\n\n"
              message += f"📅 日期: {datetime.now().strftime('%Y-%m-%d %H:%M')}\n"
              message += f"📉 回撤: {data['drawdown']:.2f}%\n\n"
              
              # 權重調整
              if data['adjustment']['required']:
                  message += "⚠️ **需要權重調整**\n"
                  message += f"➜ {data['adjustment']['reason']}\n\n"
              
              # 風險警報
              if data['risks']:
                  message += "🚨 **風險警報**\n"
                  for risk in data['risks']:
                      emoji = '⛔' if risk['level'] == 'critical' else '⚠️'
                      message += f"{emoji} {risk['message']}\n"
              else:
                  message += "✅ 無風險警報\n"
              
              # 發送通知
              payload = {
                  'content': message,
                  'username': '433-v3 Monitor'
              }
              
              response = requests.post(webhook_url, json=payload)
              if response.status_code == 204:
                  print("✅ Discord 通知發送成功")
              else:
                  print(f"❌ Discord 通知發送失敗: {response.status_code}")
          
          except FileNotFoundError:
              print("⚠️ 未找到分析結果")
          except Exception as e:
              print(f"❌ 發送通知時發生錯誤: {e}")
          PYTHON_SCRIPT
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  # ========== Job 5: 上傳到 GCP (可選) ==========
  upload-to-gcp:
    runs-on: ubuntu-latest
    needs: generate-report
    if: false  # 設為 true 以啟用
    
    steps:
      - name: 下載所有結果
        uses: actions/download-artifact@v3
      
      - name: 上傳到 GCP VM
        run: |
          # 安裝 SSH 客戶端
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 上傳檔案
          scp -o StrictHostKeyChecking=no \
              analysis-results/analysis.json \
              ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }}:/var/www/html/433-monitor/data/
          
          echo "✅ 檔案已上傳到 GCP VM"
